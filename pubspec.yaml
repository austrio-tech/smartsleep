name: smartsleep
description: "Personalized Sleep Quality Analyzer mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  flutter_form_builder: ^9.2.1
  form_builder_validators: ^10.0.1
  intl: ^0.19.0
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.2
  share_plus: ^10.0.0
  path_provider: ^2.1.5
  http: ^1.2.0
  noise_meter: ^5.0.2
  camera: ^0.10.5+1
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  intl: 0.20.2

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/SmartSleepLogo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - lib/SmartSleepLogo.png
